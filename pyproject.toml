[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jollux-immigration-data"
version = "0.1.0"
description = "Reusable tools for normalizing U.S. employment immigration disclosure data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jollux Labs" }]
dependencies = ["openpyxl>=3.1,<4"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
jollux-immigration-data = "jollux_immigration_data.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
